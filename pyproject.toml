[project]
name = "pennypost"
version = "0.1.0"
description = "A self-hosted newsletter engine as a library: you own the Postgres, an ESP owns the SMTP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Solo Zero Labs" }]
keywords = ["newsletter", "email", "drip", "resend", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
# httpx is the ONLY runtime dependency, and only the Resend transport imports it.
# There is deliberately no database driver here: every store function either
# builds SQL or takes a caller-supplied `execute` callable, so the host keeps
# ownership of its connection pool, its driver, and its transaction boundaries.
dependencies = ["httpx>=0.27"]

[project.scripts]
pennypost = "pennypost.cli:main"

[project.urls]
Homepage = "https://github.com/solozerolabs/pennypost"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pennypost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
